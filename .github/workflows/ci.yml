name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent run per branch / PR; cancel older runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # engines: ">=22.6.0" — verify both the current LTS line and the latest.
        node-version: ["22.x", "24.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The gates are listed one per step rather than as a single `npm run preflight`
      # so a failure names itself in the job log instead of in a wall of output.
      - name: Typecheck (cache-free gate)
        run: npm run typecheck:ci

      - name: Typecheck tests, scripts and vitest config (cache-free)
        run: npm run typecheck:test:ci

      - name: Declaration gate (isolatedDeclarations)
        run: npm run check:decl

      - name: Lint (strict)
        run: npm run lint:strict

      - name: Lint (type-aware)
        run: npm run lint:types

      - name: Format check
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:coverage

      # tsc exiting 0 does not prove the emitted JS loads: this builds dist/ and
      # actually executes it, which is the only check that catches a module
      # resolution gap between the compiler and Node.
      - name: Runtime probe (build dist/ and execute it)
        run: npm run probe

      - name: Upload coverage artifact
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  smoke-cli:
    name: CLI smoke test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: preflight

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: apts --version
        run: node --experimental-strip-types bin/apts.ts --version

      - name: apts list
        run: node --experimental-strip-types bin/apts.ts list

      - name: apts search "strict tsconfig"
        run: node --experimental-strip-types bin/apts.ts search "strict tsconfig"

      - name: apts retrieve ts-npm-zod-starter
        run: node --experimental-strip-types bin/apts.ts retrieve ts-npm-zod-starter

  package:
    name: npm pack dry-run
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm pack --dry-run
        run: npm pack --dry-run

      - name: Verify expected tarball contents
        run: |
          npm pack --json > pack.json
          jq -e '.[0].files | map(.path) | any(. == "dist/bin/apts.js")' pack.json > /dev/null
          jq -e '.[0].files | map(.path) | any(. == "dist/src/lib/cli.js")' pack.json > /dev/null
          jq -e '.[0].files | map(.path) | any(. == "src/data/skills.index.json.gz")' pack.json > /dev/null
          jq -e '.[0].files | map(.path) | any(. == "skills/ts-tsconfig-modern-strict-starter/SKILL.md")' pack.json > /dev/null
          jq -e '.[0].files | map(.path) | all(. != ("src/lib/cli.test.ts"))' pack.json > /dev/null
          jq -e '.[0].files | map(.path) | all(. != ("bin/apts.ts"))' pack.json > /dev/null
