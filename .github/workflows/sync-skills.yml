name: Sync skills + rebuild index

on:
  schedule:
    # Daily at 03:30 UTC. Cheap, idempotent — only opens a PR if upstream changed.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-rebuild:
    name: Sync upstream skills and rebuild embedding index
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Hugging Face model files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            node_modules/@huggingface/transformers/.cache
          key: hf-${{ runner.os }}-xenova-all-minilm-l6-v2

      - name: Clone agent-primary-ts-starters
        run: git clone --depth=1 https://github.com/kongyo2/agent-primary-ts-starters.git refs/agent-primary-ts-starters

      - name: Sync skills
        run: npm run sync-skills

      - name: Build embedding index
        run: npm run build:index

      - name: Verify preflight still passes
        run: npm run preflight

      - name: Detect changes
        id: diff
        run: |
          git add skills src/data
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Open PR with regenerated skills + index
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: sync skills and rebuild embedding index"
          title: "chore: sync skills and rebuild embedding index"
          body: |
            Automated sync of `skills/` from
            [kongyo2/agent-primary-ts-starters](https://github.com/kongyo2/agent-primary-ts-starters)
            plus a regenerated `src/data/skills.index.json.gz`.

            Preflight (`typecheck` + `lint:strict` + `format:check` + `test:coverage`) passed
            against the new content. Merge to publish a new `@kongyo2/apts` release.
          branch: chore/sync-skills
          delete-branch: true
          add-paths: |
            skills/**
            src/data/**
